<!DOCTYPE html>
<html lang="kn">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#2f6b3a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="ಜಲಗಾರ">
<title>ಜಲಗಾರ · Jalagara</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/logo.svg" type="image/svg+xml">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Kannada:wght@400;600;700&family=Noto+Sans:wght@400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#f4f1ea; --card:#fffdf8; --ink:#1f2a1f; --ink2:#4d5a4b; --muted:#7c8679; --line:#e2ddd0;
  --green:#2f6b3a; --green2:#3f8a4c; --greenbg:#e5efe2; --accent:#b4572e; --warn:#a33a2a; --warnbg:#f8e6e1;
  --r:14px; --shadow:0 1px 2px rgba(40,50,30,.08),0 2px 8px rgba(40,50,30,.05);
  --sat:env(safe-area-inset-top,0px); --sab:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root{
  --bg:#141812; --card:#1d221b; --ink:#e9eee5; --ink2:#bcc6b7; --muted:#8b9686; --line:#2f362c;
  --green:#7cc489; --green2:#95d6a0; --greenbg:#24331f; --accent:#e08a5f; --warn:#f08b78; --warnbg:#3a221d;
  --shadow:none;
}}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink)}
body{font-family:var(--font,"Noto Sans Kannada","Noto Sans",system-ui,sans-serif);font-size:16px;line-height:1.45;-webkit-text-size-adjust:100%}
button,input,textarea,select{font:inherit;color:inherit}
.wrap{max-width:640px;margin:0 auto;padding:calc(12px + var(--sat)) 14px calc(96px + var(--sab))}
header.top{display:flex;align-items:center;gap:10px;margin-bottom:10px}
header.top h1{font-size:1.25rem;margin:0;flex:1;line-height:1.2}
header.top h1 small{display:block;font-size:.8rem;font-weight:400;color:var(--muted)}
.langbtn{border:1px solid var(--line);background:var(--card);border-radius:999px;padding:6px 14px;font-weight:600;min-height:40px}
.banner{font-size:.85rem;border-radius:10px;padding:8px 12px;margin:0 0 12px;background:var(--greenbg);color:var(--ink2)}
.banner.warn{background:var(--warnbg);color:var(--warn)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--shadow);padding:14px;margin-bottom:12px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);display:flex;flex-direction:column;align-items:center;padding-bottom:var(--sab);z-index:20}
nav.tabs .in{display:flex;max-width:640px;width:100%}
nav.tabs a{flex:1;text-align:center;text-decoration:none;color:var(--muted);padding:8px 4px 10px;font-size:.78rem;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a.on{color:var(--green);font-weight:700}
nav.tabs a.addtab span.plus{background:var(--green);color:#fff;border-radius:50%;width:34px;height:34px;display:flex;align-items:center;justify-content:center;margin-top:-2px}
@media (prefers-color-scheme:dark){nav.tabs a.addtab span.plus{color:#10140f}}
h2{font-size:1.1rem;margin:4px 0 12px}
h3{font-size:1rem;margin:0 0 10px}
.muted{color:var(--muted)}
.small{font-size:.85rem}
label.f{display:block;font-weight:600;font-size:.9rem;margin:0 0 4px;color:var(--ink2)}
.field{margin-bottom:14px}
input[type=text],input[type=search],input[type=url],input[type=number],input[type=date],input[type=time],textarea,select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px}
textarea{min-height:96px;resize:vertical}
input:focus,textarea:focus,select:focus,button:focus-visible{outline:2px solid var(--green2);outline-offset:1px}
.row{display:flex;gap:10px}
.row>*{flex:1;min-width:0}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden;margin-bottom:14px}
.seg button{flex:1;border:0;background:transparent;padding:10px;min-height:46px}
.seg button.on{background:var(--green);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.seg button.on{color:#10140f}}
.btn{border:0;border-radius:12px;padding:12px 18px;min-height:48px;font-weight:700;background:var(--green);color:#fff;cursor:pointer}
@media (prefers-color-scheme:dark){.btn{color:#10140f}}
.btn.ghost{background:transparent;color:var(--green);border:1px solid var(--line)}
.btn.danger{background:transparent;color:var(--warn);border:1px solid var(--line)}
.btn.block{width:100%}
.btn:disabled{opacity:.5}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:8px}
.chip{background:var(--greenbg);border-radius:999px;padding:5px 6px 5px 12px;display:inline-flex;align-items:center;gap:4px;font-size:.92rem}
.chip button{border:0;background:transparent;width:28px;height:28px;border-radius:50%;color:var(--muted)}
.chip.static{padding:4px 10px}
.item{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px dashed var(--line)}
.item:last-child{border-bottom:0}
.item .nm{flex:1;min-width:0}
.item .nm .haz{color:var(--warn);font-size:.75rem;font-weight:700;margin-left:4px}
.step{display:flex;align-items:center;gap:4px}
.step button{width:44px;height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:1.3rem;font-weight:700;color:var(--green)}
.step input{width:70px;text-align:center;min-height:44px;padding:6px}
.extra{display:flex;gap:6px;align-items:center;margin-bottom:8px}
.extra input[type=text]{flex:1}
.extra input[type=number]{width:80px}
.iconbtn{border:1px solid var(--line);background:var(--bg);border-radius:10px;width:44px;height:44px;flex:none;color:var(--muted)}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(88px,1fr));gap:6px}
.photos .ph{position:relative;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--line)}
.photos .ph img,.photos .ph video{width:100%;height:100%;object-fit:cover;display:block}
.photos .ph button{position:absolute;top:4px;right:4px;width:28px;height:28px;border-radius:50%;border:0;background:rgba(0,0,0,.6);color:#fff}
.photos .ph .vtag{position:absolute;left:4px;bottom:4px;background:rgba(0,0,0,.6);color:#fff;font-size:.7rem;border-radius:6px;padding:1px 6px}
.filebtn{display:inline-flex;align-items:center;justify-content:center;gap:6px;border:1px dashed var(--green2);color:var(--green);border-radius:12px;padding:10px 14px;min-height:48px;font-weight:600;cursor:pointer;width:100%}
.filebtn input{display:none}
.entry{cursor:pointer}
.entry .hd{display:flex;align-items:baseline;gap:8px}
.entry .dayno{background:var(--green);color:#fff;border-radius:8px;padding:2px 8px;font-size:.8rem;font-weight:700;white-space:nowrap}
@media (prefers-color-scheme:dark){.entry .dayno{color:#10140f}}
.entry .dt{font-weight:700;flex:1}
.entry .tot{font-weight:700;color:var(--green);white-space:nowrap;border-radius:999px;padding:2px 10px;min-width:2.4em;text-align:center;font-variant-numeric:tabular-nums}
.entry .tot.st-wait{background:#c0392b;color:#fff}
.entry .tot.st-part{background:transparent;color:#c0392b;box-shadow:inset 0 0 0 2px #c0392b}
.entry .tot.st-done{color:var(--green)}
.tot-key{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:.78rem;color:var(--muted);margin:-4px 2px 10px}
.tot-key i{display:inline-block;width:12px;height:12px;border-radius:50%;vertical-align:-1px;margin-right:4px}
.tot-key i.w{background:#c0392b}.tot-key i.p{box-shadow:inset 0 0 0 2px #c0392b}
.entry .meta{color:var(--muted);font-size:.85rem;margin:4px 0 6px;display:flex;flex-wrap:wrap;gap:4px 12px}
.entry .notes{font-size:.92rem;color:var(--ink2);white-space:pre-wrap;margin-top:6px;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.entry.open .notes{-webkit-line-clamp:unset}
.entry .thumbs{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.entry .thumbs img,.entry .thumbs video{width:72px;height:72px;object-fit:cover;border-radius:8px;flex:none}
.entry.open .thumbs img,.entry.open .thumbs video{width:100%;height:auto;max-height:420px;object-fit:contain;background:#000}
.entry.open .thumbs{flex-direction:column}
.entry .acts{display:none;gap:8px;margin-top:10px}
.entry.open .acts{display:flex}
.rest{border-style:dashed;background:transparent;box-shadow:none}
.rest .dayno{background:var(--muted)}
.monthhd{font-size:.85rem;font-weight:700;color:var(--muted);margin:18px 2px 8px;text-transform:uppercase;letter-spacing:.03em}
.ranges{display:flex;gap:6px;overflow-x:auto;padding-bottom:4px;margin-bottom:10px}
.ranges button{flex:none;border:1px solid var(--line);background:var(--card);border-radius:999px;padding:8px 14px;min-height:40px;white-space:nowrap}
.ranges button.on{background:var(--green);border-color:var(--green);color:#fff;font-weight:700}
@media (prefers-color-scheme:dark){.ranges button.on{color:#10140f}}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:8px;margin-bottom:12px}
@media (min-width:520px){.kpis{grid-template-columns:repeat(3,1fr)}}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.kpi .v{font-size:1.5rem;font-weight:700;line-height:1.15;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.8rem;color:var(--muted)}
.kpi.haz .v{color:var(--warn)}
.bars .b{margin-bottom:10px}
.bars .b .t{display:flex;justify-content:space-between;font-size:.92rem;margin-bottom:3px}
.bars .b .t span:last-child{font-weight:700;font-variant-numeric:tabular-nums}
.bars .b .track{height:10px;border-radius:5px;background:var(--line);overflow:hidden}
.bars .b .fill{height:100%;border-radius:0 4px 4px 0;background:var(--green2)}
.bars .b.haz .fill{background:var(--accent)}
table.t{width:100%;border-collapse:collapse;font-size:.92rem}
table.t th,table.t td{text-align:left;padding:7px 4px;border-bottom:1px solid var(--line)}
table.t td.n,table.t th.n{text-align:right;font-variant-numeric:tabular-nums}
.chartbox{position:relative}
.chartbox svg{width:100%;height:auto;display:block}
.chartbox svg text{fill:var(--muted);font-size:11px;font-family:inherit}
.tip{position:absolute;pointer-events:none;background:var(--ink);color:var(--bg);font-size:.8rem;border-radius:8px;padding:6px 8px;white-space:nowrap;transform:translate(-50%,-110%);display:none}
.mt{color:var(--muted);cursor:help}
.txi{width:.78em;height:.78em;vertical-align:-.08em;margin-left:.25em;opacity:.6;flex:none;display:inline-block}
.tx{cursor:pointer}
.tx.orig .txi{opacity:1;color:var(--accent)}
.chip .mt .txi{margin-left:.15em}
input.mtin{border-style:dashed}
.setitem .linkish{border:0;background:transparent;padding:4px 0;text-align:left;cursor:pointer;color:inherit;font:inherit}
.promote{margin-top:16px;padding-top:4px;border-top:1px solid var(--line)}
.promote h4{margin:10px 0 2px;font-size:.95rem}
.btn.small{min-height:36px;padding:6px 10px;font-size:.85rem}
.setitem{display:flex;gap:6px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.setitem .nm{flex:1;min-width:0}
.setitem.hidden .nm{opacity:.5;text-decoration:line-through}
.toast{position:fixed;left:50%;bottom:calc(80px + var(--sab));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:.92rem;z-index:50;display:none;max-width:90vw}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:60}
.modal .box{background:var(--card);border-radius:18px 18px 0 0;padding:20px 18px calc(18px + var(--sab));width:100%;max-width:640px}
.modal .box p{margin:0 0 16px;font-size:1.05rem}
.modal .row .btn{flex:1}
.empty{text-align:center;padding:36px 16px;color:var(--muted)}
.empty .btn{margin-top:14px}
.hint{font-size:.8rem;color:var(--muted);margin-top:4px}
.loading{text-align:center;padding:40px;color:var(--muted)}
@media (prefers-color-scheme:dark){header.top h1 .logo,#splash img{filter:invert(.9)}}
/* splash: the large logo over everything until the first screen is ready */
#splash{position:fixed;inset:0;z-index:80;background:var(--bg);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;transition:opacity .3s ease}
#splash.out{opacity:0;pointer-events:none}
#splash img{width:min(60vw,260px);height:auto}
#splash .nm,#splash .dots{position:absolute;left:0;right:0;text-align:center}
#splash .nm{top:calc(50% + min(30vw,130px) + 10px);font-size:1.7rem;font-weight:700;font-family:"Noto Sans Kannada","Noto Sans",sans-serif;color:var(--ink)}
#splash .dots{top:calc(50% + min(30vw,130px) + 64px)}
#splash .dots i{display:inline-block;width:6px;height:6px;border-radius:50%;background:var(--muted);margin:0 3px;animation:pulse 1.2s infinite}
#splash .dots i:nth-child(2){animation-delay:.2s}#splash .dots i:nth-child(3){animation-delay:.4s}
/* opened from the home screen: start exactly where Android's own splash leaves off (small logo, same
   background), then grow into the large logo, so the two read as one */
@media (display-mode:standalone){
  #splash{background:#f4f1ea}                                   /* = manifest background_color */
  #splash img{filter:none!important;animation:grow .7s cubic-bezier(.2,.7,.2,1) .15s both}
  #splash .nm{color:#1f2a1f;animation:fadeup .5s ease .55s both}
  #splash .dots{animation:fadeup .4s ease .8s both}
  #splash .dots i{background:#7c8679}
}
@keyframes grow{from{transform:scale(calc(128 / 260))}to{transform:none}}
@keyframes fadeup{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){#splash img,#splash .nm,#splash .dots{animation:none!important}}
.copybox{width:100%;min-height:140px;font-family:ui-monospace,monospace;font-size:.75rem}
.syncpill{border:1px solid var(--line);background:var(--card);border-radius:16px;padding:5px 10px;min-height:40px;font-size:.76rem;line-height:1.25;display:inline-flex;align-items:center;gap:6px;color:var(--ink2);max-width:min(48vw,190px);text-align:left;white-space:normal;overflow:hidden}
.syncpill.pending{color:var(--accent)}
.syncpill.err{color:var(--warn);border-color:var(--warn)}
.syncpill.ok{color:var(--green)}
.dot{width:8px;height:8px;border-radius:50%;background:currentColor;flex:none}
.syncpill.checking .dot{animation:pulse 1.2s ease-in-out infinite}
@keyframes pulse{50%{opacity:.25;transform:scale(.7)}}
@media (prefers-reduced-motion:reduce){.syncpill.checking .dot{animation:none;opacity:.5}}
.photos .ph .pend{position:absolute;left:4px;bottom:4px;background:var(--accent);color:#fff;font-size:.68rem;border-radius:6px;padding:1px 6px}
.vids{display:flex;flex-direction:column;gap:8px;margin-bottom:8px}
.vid{display:flex;gap:10px;align-items:center;text-decoration:none;color:inherit;background:var(--bg);border-radius:10px;padding:6px;border:1px solid var(--line)}
.vid img{width:96px;height:54px;color:transparent;object-fit:cover;border-radius:6px;flex:none;background:#000}
.vid span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:.85rem}
.entry .vidrow{display:flex;gap:6px;overflow-x:auto;margin-top:8px}
.entry .vidrow a{position:relative;flex:none}
.entry .vidrow img{width:128px;height:72px;background:#222;color:transparent;object-fit:cover;border-radius:8px;display:block}
.entry .vidrow a::after{content:"▶";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:1.4rem;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.vt{position:relative;display:block;flex:none;background:#222;border-radius:8px}
.entry .thumbs>img{background:var(--line)}
.vt i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:1.3rem;text-shadow:0 1px 4px rgba(0,0,0,.8);pointer-events:none}
.entry .thumbs .vt img,.entry .thumbs .vt video{background:#222;color:transparent}
.photos .ph .vt,.photos .ph .vt video,.photos .ph .vt img{width:100%;height:100%;object-fit:cover;display:block;background:#222;color:transparent}
.entry.open .thumbs iframe{width:100%;aspect-ratio:9/16;max-height:560px;border:0;border-radius:8px;background:#000}
.entry.open .thumbs video{border-radius:8px}
.aibox{margin:-2px 0 12px}
.aipanel{border:1px solid var(--green2);background:var(--greenbg);border-radius:12px;padding:12px}
.airow{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.airow input{width:22px;height:22px;flex:none}
.airow .nm{flex:1;min-width:0}
.airow .nm small{display:block;color:var(--muted);font-size:.75rem}
.airow .cur{color:var(--muted);font-size:.8rem;white-space:nowrap}
.airow .sug{font-size:1.15rem;min-width:2.5em;text-align:right;color:var(--green)}
.aipanel .row{margin-top:10px}
header.top h1{display:flex;align-items:center;gap:10px}
header.top h1 .logo{width:58px;height:58px;flex:none;margin:-6px -2px -6px -6px}
.langgrid{display:grid;grid-template-columns:1fr;gap:8px}
@media (min-width:480px){.langgrid{grid-template-columns:1fr 1fr}}
.verrow{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:4px}
.mbtns{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin:4px 0 6px}
.mbtn{position:relative;overflow:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-height:58px;border:1px dashed var(--green2);border-radius:12px;background:var(--greenbg);color:var(--green);font-size:1.25rem;cursor:pointer;padding:6px 2px;font-weight:600}
.mbtn span{font-size:.68rem;line-height:1.15;text-align:center}
.mbtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.at{display:flex;flex-direction:column;align-items:center;justify-content:center;width:100%;height:100%;background:var(--greenbg);color:var(--green);font-size:1.4rem}
.at small{font-size:.7rem;font-weight:700}
.afull{display:flex;align-items:center;gap:8px;margin:6px 0}.afull audio{flex:1;min-width:0}
iframe.aframe{width:100%;height:96px;border:0;border-radius:10px;background:var(--card);margin:6px 0}
#viewer .vaudio{display:flex;flex-direction:column;align-items:center;gap:18px;font-size:4rem;color:#fff;width:100%;padding:0 24px}
#viewer .vaudio audio{width:100%;max-width:520px}
#viewer iframe.aframe{height:120px;max-width:520px}
.rec{display:flex;flex-direction:column;align-items:center;gap:12px;padding:8px 0}
.rec-time{font-size:2.2rem;font-weight:700;font-variant-numeric:tabular-nums}
.rec-lvl{width:70%;height:6px;border-radius:3px;background:var(--line);overflow:hidden}.rec-lvl i{display:block;height:100%;width:0;background:var(--green);transition:width .08s}
.rec-go{width:76px;height:76px;border-radius:50%;border:4px solid #c0392b;background:var(--card);display:flex;align-items:center;justify-content:center;cursor:pointer}
.rec-go span{width:46px;height:46px;border-radius:50%;background:#c0392b;transition:all .2s}
.rec-go.on span{width:28px;height:28px;border-radius:6px}
.rec audio{width:100%}
.vp{position:relative;background:#000;border-radius:10px;overflow:hidden;width:100%;line-height:0}
.vp video{width:100%;max-height:60vh;display:block;background:#000;object-fit:contain}
.vp-big{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);width:44px;height:44px;border-radius:50%;border:0;background:rgba(0,0,0,.45);color:#fff;font-size:1.3rem;cursor:pointer;padding-left:4px}
.vp.playing .vp-big,.vp.started .vp-big{display:none}
.vp-bar{position:absolute;left:0;right:0;bottom:0;display:flex;align-items:center;gap:6px;padding:4px 8px;background:linear-gradient(transparent,rgba(0,0,0,.6));color:#fff;font-size:.72rem;line-height:1;transition:opacity .25s;opacity:1}
.vp.playing:not(.ui) .vp-bar{opacity:0;pointer-events:none}
.vp-bar button{border:0;background:transparent;color:#fff;font-size:.85rem;padding:4px 6px;min-width:28px;min-height:28px;cursor:pointer}
.vp-t{font-variant-numeric:tabular-nums;white-space:nowrap;opacity:.9}
.vp-seek{flex:1;min-width:40px;height:3px;accent-color:#fff;margin:0}
.vp:fullscreen{border-radius:0;display:flex;align-items:center}.vp:fullscreen video{max-height:100vh;height:100vh}
.vp.broken::after{content:"⚠";position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-size:2rem}
#viewer .vp{max-width:100%;max-height:calc(100% - 140px);background:transparent}
#viewer .vp video{max-height:calc(100vh - 160px)}
.linkbtn{border:0;background:none;padding:0 2px;color:var(--green);font-weight:700;text-decoration:underline;cursor:pointer;font-size:inherit}
a.btn{text-decoration:none;display:inline-block;box-sizing:border-box}
a.btn.block{display:block;width:100%}
#pkbar{width:100%;display:flex;justify-content:center;border-bottom:1px solid var(--line);background:color-mix(in srgb,#c0392b 6%,var(--card))}
#pkbar:empty{display:none}
#pkbar .pkin{display:flex;align-items:center;justify-content:space-between;gap:8px;max-width:640px;width:100%;padding:3px 12px}
#pkbar .pkc{font-size:.8rem;font-weight:600;color:var(--ink2);display:flex;align-items:center;gap:6px;min-width:0}
#pkbar .pkc i{width:10px;height:10px;border-radius:50%;background:#c0392b;flex:none}
#pkbar .btn{min-height:28px;padding:2px 12px;font-size:.78rem;flex:none;border-radius:999px}
body.haspk .wrap{padding-bottom:calc(132px + var(--sab))}
body.haspk .toast{bottom:calc(112px + var(--sab))}
.pkbanner{display:flex;gap:10px;align-items:center;justify-content:space-between;border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--card))}
.pkbanner .btn{flex:none;min-height:40px;padding:8px 12px}
.pkrow{margin:2px 0 4px}
.pkst{font-size:.78rem;border-radius:999px;padding:2px 9px;display:inline-block}
.pkst.done{background:var(--greenbg);color:var(--green)}
.pkst.part{background:color-mix(in srgb,var(--accent) 15%,var(--card));color:var(--accent)}
.pkst.wait{background:var(--bg);color:var(--muted);border:1px dashed var(--line)}
.entry.pickup{border-left:4px solid var(--accent)}
.entry .dayno.pk{background:var(--accent)}
.pkwho{font-weight:600;font-size:.92rem;margin-top:2px}
.pkday{display:flex;align-items:center;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.pkday input{width:22px;height:22px;flex:none}
.pkday .nm{flex:1}
.agchip{border:1px solid var(--line)!important;cursor:pointer}
.agchip.on{background:var(--green)!important;color:#fff;border-color:var(--green)!important}
@media (prefers-color-scheme:dark){.agchip.on{color:#10140f}}
.kpi.wait .v{color:var(--accent)}
.jhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 8px}
.jsum{font-size:.8rem;color:var(--muted);min-width:0}
.jsum b{color:var(--ink);font-size:.95rem}
.seg{display:flex;flex:none;background:var(--card);border:1px solid var(--line);border-radius:999px;padding:2px;margin:0;width:max-content;max-width:100%}
.seg button{white-space:nowrap;border:0;background:transparent;border-radius:999px;padding:3px 12px;font-size:.82rem;font-weight:600;color:var(--muted);cursor:pointer;min-height:30px}
.seg button.on{background:var(--green);color:#fff}
.mtile{border:0;padding:0;background:transparent;cursor:zoom-in;flex:none;display:block;line-height:0}
.entry.open .thumbs .mtile{width:100%}
.gday{margin-bottom:14px}
.gdayhd{display:flex;justify-content:space-between;align-items:center;gap:8px;width:100%;border:0;background:transparent;padding:6px 2px;font-weight:600;text-align:left;cursor:pointer;color:var(--ink)}
.ggrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:4px}
@media (min-width:520px){.ggrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.gtile{position:relative;border:0;padding:0;aspect-ratio:1;overflow:hidden;border-radius:6px;background:var(--line);cursor:zoom-in}
.gtile img,.gtile video,.gtile .vt{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.gtile .vt i{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:1.5rem;text-shadow:0 1px 4px rgba(0,0,0,.7)}
#viewer{display:none;position:fixed;inset:0;z-index:60;background:#000;color:#fff;overscroll-behavior:contain}
body.noscroll{overflow:hidden}
#viewer .vtop{position:absolute;top:0;left:0;right:0;z-index:3;display:flex;align-items:center;gap:10px;padding:max(10px,env(safe-area-inset-top)) 12px 10px;background:linear-gradient(rgba(0,0,0,.65),transparent)}
#viewer .vcount{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
#viewer .vcap{flex:1;min-width:0;font-size:.85rem;opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#viewer .vx{border:0;background:rgba(255,255,255,.15);color:#fff;width:44px;height:44px;border-radius:50%;font-size:1.2rem;cursor:pointer}
#viewer .vtrack{position:absolute;inset:0;display:flex;overflow-x:auto;overflow-y:hidden;scroll-snap-type:x mandatory;scrollbar-width:none}
#viewer .vtrack::-webkit-scrollbar{display:none}
#viewer .vtrack.locked{overflow-x:hidden}
#viewer .vslide{flex:0 0 100%;height:100%;scroll-snap-align:center;scroll-snap-stop:always;display:flex;align-items:center;justify-content:center;overflow:hidden}
#viewer .vslide img{max-width:100%;max-height:100%;object-fit:contain;transform-origin:center;user-select:none;-webkit-user-select:none;touch-action:pan-x}
#viewer .vslide video{max-width:100%;max-height:calc(100% - 140px)}
#viewer .vslide iframe{width:100%;height:calc(100% - 140px);max-width:720px;border:0;background:#111}
#viewer .vnav{position:absolute;top:50%;transform:translateY(-50%);z-index:3;border:0;background:rgba(255,255,255,.14);color:#fff;width:44px;height:64px;font-size:2rem;cursor:pointer;display:none}
#viewer .prev{left:6px;border-radius:0 10px 10px 0}#viewer .next{right:6px;border-radius:10px 0 0 10px}
@media (hover:hover){#viewer .vnav{display:block}}
#viewer .vbot{position:absolute;bottom:0;left:0;right:0;z-index:3;display:flex;justify-content:center;padding:12px 12px max(14px,env(safe-area-inset-bottom));background:linear-gradient(transparent,rgba(0,0,0,.65))}
#viewer .vbot .btn{background:rgba(255,255,255,.92);color:#1e1e1e;border:0}
.libhead{position:sticky;top:0;z-index:4;background:var(--bg);padding:4px 0 8px}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:2px 4px;margin-bottom:8px;font-size:.95rem}
.crumbs button{border:0;background:transparent;padding:4px 2px;color:var(--green);font-weight:600;cursor:pointer}
.crumbs button:last-child{color:var(--ink)}
.crumbs span{color:var(--muted)}
.libacts{display:flex;gap:8px;margin:4px 0 12px;align-items:center}
.libacts .btn{flex:1;min-height:44px;padding:8px 10px;text-align:center}
.libadd{position:relative;overflow:hidden;cursor:pointer}
.libadd input{position:absolute;inset:0;opacity:0;cursor:pointer}
.trow{display:flex;align-items:center;gap:10px;width:100%;text-align:left;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px;cursor:pointer;min-height:54px}
.trow .fold{font-size:1.35rem}
.trow .nm{flex:1;min-width:0;font-weight:600}
.trow .nm small{display:block;font-weight:400;color:var(--muted);font-size:.78rem}
.trow .cnt{font-size:.78rem;color:var(--muted);white-space:nowrap}
.trow .chev{color:var(--muted);font-size:1.3rem}
.trow.small{min-height:44px;padding:8px 10px;margin-bottom:4px}
.trow.cur{border-color:var(--green2);background:var(--greenbg)}
.fgrid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;margin-top:10px}
@media (min-width:520px){.fgrid{grid-template-columns:repeat(4,minmax(0,1fr))}}
.ftile{border:0;background:transparent;padding:0;text-align:left;cursor:pointer;min-width:0}
.ftile .thumb{position:relative;display:flex;align-items:center;justify-content:center;aspect-ratio:1;border-radius:10px;overflow:hidden;background:var(--card);border:1px solid var(--line)}
.ftile .thumb img,.ftile .thumb video{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.ftile .thumb .ficon{display:flex;flex-direction:column;align-items:center;font-size:1.8rem;line-height:1.1}
.ftile .thumb .ficon small{font-size:.65rem;font-weight:700;color:var(--muted);margin-top:2px}
.ftile .thumb .play{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:#fff;font-style:normal;font-size:1.4rem;text-shadow:0 1px 4px rgba(0,0,0,.7)}
.ftile .thumb .pend{position:absolute;left:4px;bottom:4px;background:var(--accent);color:#fff;font-size:.68rem;border-radius:6px;padding:1px 6px}
.ftile .ft{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:.8rem;margin-top:4px;line-height:1.25}
.ftile small{display:block;font-size:.7rem;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sheetbox{max-height:88vh;overflow:auto}
.sheetbox h3{margin:0 0 12px;font-size:1.05rem;word-break:break-word}
.fview img,.fview video{width:100%;max-height:52vh;object-fit:contain;background:#000;border-radius:10px;display:block}
.fview iframe{width:100%;height:52vh;border:0;border-radius:10px;background:#000}
.fview .bigicon{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:28px;font-size:3rem;background:var(--bg);border-radius:10px}
.fview .bigicon small{font-size:.85rem;color:var(--muted);margin-top:6px;word-break:break-all;text-align:center}
.tree{max-height:55vh;overflow:auto}
.libjump{border:1px solid var(--line)!important;cursor:pointer}
select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;min-height:46px}
nav.tabs a{font-size:.72rem}
.pendbadge{font-size:.72rem;color:var(--accent);font-weight:700;white-space:nowrap}
.linkrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.linkrow a{flex:1;text-align:center;text-decoration:none}
</style>
